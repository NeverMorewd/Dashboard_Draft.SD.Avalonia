name: Sync upstream template repository changes

on:
  # Scheduled trigger: run every Tuesday at 3:00 AM UTC. Adjust as needed.
  schedule:
    - cron: "0 3 * * 2"
  # Allow manual trigger from the GitHub Actions page
  workflow_dispatch:

jobs:
  template-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v3
        with:
          # Use the automatically generated GITHUB_TOKEN for subsequent operations
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync template repository
        uses: AndreasAugustin/actions-template-sync@v0.7.2-draft
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Critical: specify your template repository address
          source_repo_path: NeverMorewd/DotNetPerformanceDashboard
          upstream_branch: main # The template's main branch is 'main'
          # Add a label to the automatically created PR for easy identification and management
          pr_labels: "template-update"
